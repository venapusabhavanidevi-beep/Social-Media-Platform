        <!-- Post Box -->
        <div class="post-box">
            <textarea id="postInput" placeholder="What's on your mind?"></textarea>
            <button onclick="addPost()">Post</button>
        </div>

        <!-- Posts -->
        <div id="posts"></div>

    </div>

    <script>

        function addPost() {

            let postInput = document.getElementById("postInput");

            let postText = postInput.value;

            if (postText == "") {
                alert("Enter something!");
                return;
            }

            let posts = document.getElementById("posts");

            let postDiv = document.createElement("div");

            postDiv.className = "post";

            postDiv.innerHTML = `
                <h3>John</h3>

                <p>${postText}</p>

                <div class="actions">
                    <button onclick="likePost(this)">Like</button>

                    <button onclick="commentPost()">Comment</button>

                    <button onclick="followUser()">Follow</button>
                </div>
            `;

            posts.prepend(postDiv);

            postInput.value = "";
        }

        function likePost(button) {

            if (button.innerHTML == "Like") {
                button.innerHTML = "Liked";
            }
            else {
                button.innerHTML = "Like";
            }
        }

        function commentPost() {

            let comment = prompt("Enter your comment:");

            if (comment != "") {
                alert("Comment Added: " + comment);
            }
        }

        function followUser() {

            alert("You followed John!");
        }

    </script>
